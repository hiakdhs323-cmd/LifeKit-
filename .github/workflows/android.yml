name: Build LifeKit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          test -s app/src/main/drawable/lifekit_icon.jpg
          cp app/src/main/drawable/lifekit_icon.jpg app/src/main/res/drawable-nodpi/lifekit_icon.jpg
          test -s app/src/main/res/drawable-nodpi/lifekit_icon.jpg
          file app/src/main/res/drawable-nodpi/lifekit_icon.jpg

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeKit-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeKit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
